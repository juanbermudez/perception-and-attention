<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121212">
  <meta name="description" content="A review of some basics of human perception and attention, with an interactive 3D brain.">
  <title>Perception &amp; Attention</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%230b0b0b'/%3E%3Cpath d='M12 12c12-12 26 5 14 16S0 17 12 12m14 0C14 0 0 17 12 28s26-11 14-16' fill='none' stroke='%23cccccc' stroke-width='3'/%3E%3C/svg%3E">
  <style>/* STYLES */</style>
</head>
<body>
  <main class="workspace">
    <!-- The rail comes first, then the explanations, then the 3D view: the same order as on screen, for Tab and for screen readers. -->
    <nav class="rail" id="rail" aria-label="Topics">
      <button class="rail-button" id="home-button" aria-label="Overview" data-tip="Overview" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v11h14V9"/><path d="M10 20v-6h4v6"/></svg></button>
      <div class="pathway-list" id="pathway-list"></div>
      <!-- Pinned to the bottom of the rail: search, the source and About. -->
      <div class="rail-foot">
        <button class="rail-button rail-tool" id="notes-button" aria-label="Notes" data-tip="Notes" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h4"/></svg></button>
        <button class="rail-button rail-tool" id="search-button" aria-label="Search" data-tip="Search" aria-haspopup="dialog" aria-expanded="false" aria-keyshortcuts="Meta+K Control+K /"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg></button>
        <a class="rail-button rail-tool" id="source-link" href="https://github.com/juanbermudez/perception-and-attention" target="_blank" rel="noopener noreferrer" aria-label="Source code on GitHub" data-tip="Source code on GitHub"><svg class="brand-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg></a>
        <button class="rail-button rail-tool" id="about-button" aria-label="About" data-tip="About" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .9-1 1.6v.4"/><path d="M12 17v.1"/></svg></button>
      </div>
    </nav>

    <aside class="inspector" id="inspector" aria-label="Explanations">
      <div class="inspector-resize" id="inspector-resize" role="separator" aria-label="Resize explanation panel" aria-orientation="vertical" aria-valuemin="300" aria-valuemax="560" aria-valuenow="368" tabindex="0"></div>
      <div class="inspector-surface">
        <section class="intro-view" id="intro-view" aria-labelledby="intro-title">
          <header class="inspector-heading intro-heading"><div class="heading-slot"><h2 class="intro-title" id="intro-title"></h2></div></header>
          <div class="inspector-scroll" id="intro-scroll"></div>
        </section>
        <section class="path-view" id="path-view" aria-labelledby="path-title" hidden>
          <header class="inspector-heading">
            <div class="heading-slot">
              <button class="back-link" id="back-link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span id="back-label">Overview</span></button>
              <h2 id="path-title" tabindex="-1"></h2>
            </div>
            <p class="path-subtitle" id="path-subtitle"></p>
          </header>
          <div class="panel-tabs" id="panel-tabs" role="tablist" aria-label="Topic sections">
            <button class="panel-tab" id="guide-tab" role="tab" data-panel="guide" aria-selected="true" aria-controls="guide-panel">Walkthrough</button>
            <button class="panel-tab" id="region-tab" role="tab" data-panel="region" aria-selected="false" aria-controls="region-drawer" tabindex="-1">Regions</button>
            <button class="panel-tab" id="streams-tab" role="tab" data-panel="streams" aria-selected="false" aria-controls="sensory-controls" tabindex="-1" hidden>Streams</button>
          </div>
          <div class="inspector-body" id="inspector-body">
            <section class="guide-panel" id="guide-panel" role="tabpanel" aria-labelledby="guide-tab" tabindex="0">
              <p class="path-intro" id="path-intro"></p>
              <ol class="path-steps" id="path-steps" aria-label="Steps"></ol>
              <div class="path-after" id="path-after"></div>
            </section>
            <section class="region-drawer" id="region-drawer" role="tabpanel" aria-labelledby="region-tab" tabindex="0" hidden><div id="drawer-content"></div></section>
            <section class="sensory-controls" id="sensory-controls" role="tabpanel" aria-labelledby="streams-tab" tabindex="0" hidden>
              <p class="panel-lede">Vision, sound and touch inputs arrive at the same time. Set a priority to see how attention changes the balance between them.</p>
              <div id="sensory-streams" class="sensory-streams"></div>
              <div class="network-row"><button id="control-network" class="layer-button" aria-pressed="true"><i class="stream-dot" style="--stream-color:#eed183"></i>Control network links</button><button id="show-all-streams" class="stream-action">Reset</button></div>
              <div class="priority-control"><span class="control-label">Give priority to</span><div id="attention-priority" role="group" aria-label="Attention priority"></div></div>
              <label class="gain-control"><span class="control-label">Attention gain</span><input id="attention-gain" type="range" min="0" max="100" step="5" value="65"><output id="attention-gain-value"></output></label>
              <figure class="normalization" id="normalization" aria-label="Normalization model output"></figure>
            </section>
          </div>
          <footer class="step-controls" id="step-controls" aria-label="Walkthrough controls">
            <button class="step-nav" id="step-prev" aria-label="Previous step"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
            <div class="step-progress" id="step-progress" role="group" aria-label="Steps"></div>
            <button class="step-play" id="step-play" aria-pressed="false"><svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7Z"/></svg><svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg><span id="step-play-label">Play</span></button>
            <button class="step-nav" id="step-next" aria-label="Next step"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
          </footer>
        </section>
      </div>
    </aside>

    <section class="brain-stage" aria-label="Interactive brain visualization">
      <h1 class="sr-only" id="scene-title">Perception &amp; Attention</h1>
      <div class="orbit-surface" id="orbit-surface">
        <div id="canvas-container"><div id="loading" role="status"><span class="loading-orbit"></span>Making connections…</div></div>
        <div id="region-labels" role="group" aria-label="Brain region markers"></div>
      </div>
      <div class="stage-toast" id="toast" role="status" aria-live="polite"></div>
      <div class="agent-presence" id="agent-presence" aria-hidden="true"><span class="agent-dot"></span><b>Assistant</b><span class="agent-said"></span></div>
    </section>
  </main>
  <dialog id="info-dialog" aria-label="About">
    <header class="about-head">
      <div class="about-tabs" role="tablist" aria-label="About sections">
        <button class="about-tab" role="tab" id="about-tab-about" data-about="about" aria-controls="about-panel" aria-selected="true">About</button>
        <button class="about-tab" role="tab" id="about-tab-papers" data-about="papers" aria-controls="about-panel" aria-selected="false" tabindex="-1">Papers</button>
        <button class="about-tab" role="tab" id="about-tab-code" data-about="code" aria-controls="about-panel" aria-selected="false" tabindex="-1">Code</button>
        <button class="about-tab" role="tab" id="about-tab-models" data-about="models" aria-controls="about-panel" aria-selected="false" tabindex="-1">Models</button>
      </div>
      <button class="drawer-close" id="dialog-close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
    </header>
    <div class="about-body" id="about-panel" role="tabpanel" aria-labelledby="about-tab-about" tabindex="0"></div>
  </dialog>
  <script type="module">/* SCRIPT */</script>
</body>
</html>
